# ============================================================
# deployment.yaml  —  2일차 4차시 Kubernetes 배포 실습용
# ============================================================

# ── Secret: DB 연결 정보 (base64 인코딩) ────────────────────
apiVersion: v1
kind: Secret
metadata:
  name: complaint-db-secret
type: Opaque
stringData:                  # stringData는 평문으로 작성 가능 (K8s가 자동 인코딩)
  DB_HOST: "192.168.0.20"    # DB VM 사설 IP로 교체
  DB_USER: "complaint_user"
  DB_PASSWORD: "Minjeon2024!"
  DB_NAME: "complaints_db"

---
# ── Deployment ───────────────────────────────────────────────
apiVersion: apps/v1
kind: Deployment
metadata:
  name: complaint-app
spec:
  replicas: 1                 # 5차시 실습에서 3으로 늘림
  selector:
    matchLabels:
      app: complaint-app
  template:
    metadata:
      labels:
        app: complaint-app
    spec:
      containers:
        - name: complaint-app
          image: <레지스트리 주소>/complaint-app:latest   # 실습 시 교체
          ports:
            - containerPort: 8080
          envFrom:
            - secretRef:
                name: complaint-db-secret
          env:
            - name: DB_PORT
              value: "3306"
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 20

---
# ── Service (LoadBalancer) ───────────────────────────────────
apiVersion: v1
kind: Service
metadata:
  name: complaint-service
spec:
  type: LoadBalancer
  selector:
    app: complaint-app
  ports:
    - protocol: TCP
      port: 80
      targetPort: 8080
