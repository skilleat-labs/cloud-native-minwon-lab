site_name: 온라인 민원 서비스로 배우는 클라우드 & 클라우드 네이티브
site_url: https://skilleat-labs.github.io/cloud-native-minwon-lab/
site_description: NHN Cloud 실습 가이드 — 공공기관 클라우드 운영자 과정

theme:
  name: material
  language: ko
  palette:
    - scheme: default
      primary: indigo
      accent: indigo
  features:
    - navigation.tabs
    - navigation.sections
    - navigation.top
    - toc.integrate
    - search.highlight
    - content.code.copy

nav:
  - 홈: index.md
  - Day 1 — 민원 서비스를 오픈하라:
    - 개요: day1/index.md
    - 1차시 — 콘솔 로그인 & 환경 확인: day1/session1.md
    - 2차시 — 네트워크 & 보안 그룹 & LB 구성: day1/session2.md
    - 3차시 — VM 생성 & Block Storage 연결: day1/session3.md
    - 4차시 — 서비스 자동 배포 & LB 등록: day1/session4.md
    - 5차시 — Object Storage & 저장소 분리: day1/session5.md
  - Day 2 — 멈추지 않게 운영하라:
    - 개요: day2/index.md
    - 1차시 — 컨테이너와 이미지, 레지스트리: day2/session1.md
    - 2차시 — 컨테이너 실행 & 동작 확인: day2/session2.md
    - 3차시 — Kubernetes & NKS 클러스터 생성: day2/session3.md
    - 4차시 — 기존 DB 유지한 채 Pod 배포: day2/session4.md
    - 5차시 — 자동 복구 & 수평 확장: day2/session5.md

extra_css:
  - stylesheets/extra.css

plugins:
  - search:
      lang: ko
  - glightbox:
      touchNavigation: true
      loop: false
      effect: zoom
      width: 100%
      height: auto
      zoomable: true

markdown_extensions:
  - admonition
  - tables
  - attr_list
  - pymdownx.highlight:
      anchor_linenums: true
  - pymdownx.superfences:
      custom_fences:
        - name: mermaid
          class: mermaid
          format: !!python/name:pymdownx.superfences.fence_code_format
